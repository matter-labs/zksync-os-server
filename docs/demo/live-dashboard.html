<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZKsync OS — Live Throughput</title>
<style>
  /* Single dark theme by design: this page lives on projectors. */
  :root {
    --bg: #0b0f14;
    --panel: #101720;
    --ink: #f2f5f8;
    --ink-2: #9fb0bf;
    --muted: #5c6b79;
    --line: #1d2835;
    --blue: #3f8fe8;
    --green: #35d07f;
    --amber: #f5a623;
    --red: #e34948;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 36px 0;
    flex: none;
  }
  .brand {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .hright { display: flex; align-items: center; gap: 26px; }
  .countdown {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink-2);
    display: none;
  }
  body.live .countdown { display: block; color: var(--green); }
  .phase {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); }
  .phase.waiting .dot { background: var(--amber); animation: pulse 1.6s infinite; }
  .phase.live .dot { background: var(--green); animation: pulse 0.9s infinite; }
  .phase.live { color: var(--green); }
  .phase.done .dot { background: var(--blue); }
  .phase.lost .dot { background: var(--red); animation: pulse 0.5s infinite; }
  .phase.lost { color: var(--red); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 36px 24px;
    min-height: 0;
    overflow: hidden;
  }
  /* Auto margins center the stage but collapse to zero when space runs out —
     nothing ever clips off the top of the viewport. */
  .stage { margin: auto 0; min-height: 0; }

  .odo-label {
    font-family: var(--mono);
    font-size: clamp(12px, 1.3vw, 18px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 0.4em;
  }
  .odometer {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(60px, 10.5vw, 170px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .eth-line {
    margin-top: 0.5em;
    font-size: clamp(16px, 2.1vw, 30px);
    color: var(--ink-2);
  }
  .eth-line b { color: var(--ink); font-weight: 650; }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: stretch;
    margin-top: clamp(18px, 3.5vh, 42px);
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 20px 12px;
    min-width: 150px;
  }
  .tile .k {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
    white-space: nowrap;
  }
  .tile .v {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(24px, 2.9vw, 42px);
    font-weight: 700;
    line-height: 1.05;
    white-space: nowrap;
  }
  .tile .u { font-size: 0.45em; font-weight: 500; color: var(--ink-2); margin-left: 6px; }
  .tile.spark { flex: 1; display: flex; flex-direction: column; min-width: 240px; }
  .tile.spark canvas { flex: 1; width: 100%; min-height: 56px; }

  /* ---- overlays (start gate + finale) ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 11, 15, 0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    z-index: 10;
    text-align: center;
    padding: 40px;
  }
  .overlay.hidden { display: none; }

  #gate-overlay .gbrand {
    font-family: var(--mono);
    font-size: 18px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  #gate-overlay h1 {
    margin: 0;
    font-size: clamp(30px, 4.5vw, 58px);
    font-weight: 700;
    letter-spacing: -0.01em;
    max-width: 22ch;
  }
  #start-btn {
    font-family: var(--mono);
    font-size: clamp(20px, 2.4vw, 32px);
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #06130c;
    background: var(--green);
    border: none;
    border-radius: 12px;
    padding: 0.75em 2.2em;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 0 40px rgba(53, 208, 127, 0.25);
  }
  #start-btn:hover { transform: scale(1.04); box-shadow: 0 0 60px rgba(53, 208, 127, 0.45); }
  #start-btn:disabled {
    background: transparent;
    color: var(--green);
    border: 2px solid var(--green);
    cursor: wait;
    box-shadow: none;
    animation: pulse 1.1s infinite;
  }
  #gate-status {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.1em;
    color: var(--muted);
    min-height: 1.4em;
  }
  #gate-status.ready { color: var(--green); }

  #final-overlay { gap: 14px; }
  #final-overlay .f-label {
    font-family: var(--mono);
    font-size: clamp(14px, 1.6vw, 22px);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--green);
  }
  #final-overlay .f-num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(70px, 13vw, 220px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    animation: land 0.6s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  #final-overlay .f-sub {
    font-size: clamp(18px, 2.4vw, 34px);
    color: var(--ink-2);
    max-width: 36ch;
  }
  #final-overlay .f-sub b { color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  @keyframes land {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">ZKsync OS · Live</div>
    <div class="hright">
      <div class="countdown" id="countdown"></div>
      <div class="phase waiting" id="phase"><span class="dot"></span><span id="phase-text">waiting for node</span></div>
    </div>
  </header>

  <main>
    <div class="stage">
      <div class="odo-label">Transactions processed</div>
      <div class="odometer" id="odo">0</div>
      <div class="eth-line" id="eth-line">&nbsp;</div>

      <div class="row">
        <div class="tile">
          <span class="k">Throughput</span>
          <span class="v"><span id="tps">0</span><span class="u">tx/s</span></span>
        </div>
        <div class="tile">
          <span class="k">Gas throughput</span>
          <span class="v"><span id="ggas">0</span><span class="u">Ggas/s</span></span>
        </div>
        <div class="tile">
          <span class="k">Blocks / s</span>
          <span class="v" id="bps">0</span>
        </div>
        <div class="tile">
          <span class="k">Block height</span>
          <span class="v" id="height">—</span>
        </div>
        <div class="tile">
          <span class="k">Sending accounts</span>
          <span class="v" id="accounts">—</span>
        </div>
        <div class="tile spark">
          <span class="k">tx/s — last 60 seconds</span>
          <canvas id="spark"></canvas>
        </div>
      </div>
    </div>
  </main>

  <!-- start gate -->
  <div class="overlay" id="gate-overlay">
    <div class="gbrand">ZKsync OS</div>
    <h1>One million transactions per second, live.</h1>
    <button id="start-btn">Start</button>
    <div id="gate-status">connecting to node…</div>
  </div>

  <!-- finale -->
  <div class="overlay hidden" id="final-overlay">
    <div class="f-label">Run complete</div>
    <div class="f-num" id="f-num">0</div>
    <div class="f-sub" id="f-sub"></div>
  </div>

<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(location.search);
  var isFile = location.protocol === "file:";
  var RPC = qs.get("rpc") || "http://127.0.0.1:8080";
  var STARTER = qs.get("start") || (isFile ? "http://127.0.0.1:7777/start" : "/start");
  var STATS = qs.get("stats") || (isFile ? "http://127.0.0.1:7777/stats" : "/stats");
  var DURATION_S = parseInt(qs.get("duration") || "60", 10);

  // Ethereum mainnet ~1.2M transactions per day (public explorer figures).
  var ETH_TXS_PER_DAY = 1200000;
  var POLL_MS = 200;
  var LIVE_ENTER_BPS = 50;   // blocks/s fallback threshold when /stats is unavailable
  var LIVE_EXIT_BPS = 20;    // below this (after being live) the run is over
  var EXIT_GRACE_MS = 2500;  // rate must stay low this long to finish
  var MIN_LIVE_MS = 8000;    // ignore early dips right after start

  var state = "waiting";     // waiting | live | done
  var lastBlock = null, lastPollAt = null;
  var txsPerBlock = 0;       // EMA
  var gasPerBlock = 0;       // EMA
  var cumTxs = 0;            // exact (from /stats) or integrated estimate
  var dispTxs = 0;           // animated display value
  var rate = 0;              // txs/s EMA (display)
  var gasRate = 0;           // gas/s (derived)
  var bps = 0;               // blocks/s EMA
  var liveStartAt = null, lowSince = null, peakTps = 0;
  var sparkData = [];        // [t, tps]
  var everConnected = false;
  var lastStats = null;      // last /stats payload seen
  var lastSubmitted = null, lastSubmittedAt = null;

  function fmt(n) { return Math.round(n).toLocaleString("en-US"); }

  function setPhase(cls, text) {
    var el = document.getElementById("phase");
    el.className = "phase " + cls;
    document.getElementById("phase-text").textContent = text;
  }

  function fetchRpc() {
    return fetch(RPC, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        jsonrpc: "2.0", id: 1,
        method: "eth_getBlockByNumber", params: ["latest", false],
      }),
    }).then(function (r) { return r.json(); });
  }

  function fetchStats() {
    return fetch(STATS).then(function (r) { return r.json(); });
  }

  // ---- start gate: the overlay stays up until the run is actually LIVE, so the
  // audience never sees an idle zeroed dashboard between click and ignition. ----
  var startBtn = document.getElementById("start-btn");
  startBtn.addEventListener("click", function () {
    startBtn.disabled = true;
    startBtn.textContent = "Igniting…";
    document.getElementById("gate-status").textContent = "load starting";
    fetch(STARTER).catch(function () { /* no gate helper: just watch for the load */ });
  });

  function gateStatus() {
    var el = document.getElementById("gate-status");
    if (startBtn.disabled) return; // "load starting" owns the line now
    if (everConnected) {
      el.textContent = "node ready";
      el.className = "ready";
    } else {
      el.textContent = "connecting to node…";
      el.className = "";
    }
  }

  function goLive(now) {
    state = "live";
    document.body.classList.add("live");
    document.getElementById("gate-overlay").classList.add("hidden");
    liveStartAt = now;
    cumTxs = 0;
    dispTxs = 0;
    peakTps = 0;
    sparkData = [];
    setPhase("live", "live");
  }

  function poll() {
    Promise.allSettled([fetchRpc(), fetchStats()]).then(function (results) {
      var rpcRes = results[0].status === "fulfilled" ? results[0].value : null;
      var stats = results[1].status === "fulfilled" ? results[1].value : null;
      var now = performance.now();

      if (stats) {
        lastStats = stats;
        if (stats.duration_s) DURATION_S = stats.duration_s;
        var acc = document.getElementById("accounts");
        if (stats.wallets) acc.textContent = fmt(stats.wallets);
      }

      if (!rpcRes || !rpcRes.result) {
        // Node unreachable. Near/past the planned end of a live run this IS the ending:
        // the benchmark finishes, verifies receipts, and shuts the node down.
        if (state === "live" && now - liveStartAt > (DURATION_S - 5) * 1000) {
          finish(now);
          return;
        }
        if (state !== "done") {
          setPhase(everConnected ? "lost" : "waiting",
                   everConnected ? "connection lost — retrying" : "waiting for node");
          gateStatus();
          setTimeout(poll, 700);
        }
        return;
      }

      if (!everConnected) {
        everConnected = true;
        if (state === "waiting") setPhase("waiting", "node up — waiting for load");
      }
      gateStatus();

      var blk = rpcRes.result;
      var bn = parseInt(blk.number, 16);
      var txc = (blk.transactions || []).length;
      var gas = parseInt(blk.gasUsed || "0x0", 16);

      if (lastBlock !== null && lastPollAt !== null) {
        var dt = (now - lastPollAt) / 1000;
        var dBlocks = Math.max(0, bn - lastBlock);
        bps = bps * 0.8 + (dBlocks / dt) * 0.2;
        if (txc > 0) txsPerBlock = txsPerBlock === 0 ? txc : txsPerBlock * 0.8 + txc * 0.2;
        if (gas > 0) gasPerBlock = gasPerBlock === 0 ? gas : gasPerBlock * 0.8 + gas * 0.2;

        // Rate: prefer the exact submitted counter from /stats.
        if (stats && typeof stats.submitted === "number" && lastSubmitted !== null) {
          var dSub = Math.max(0, stats.submitted - lastSubmitted);
          var sdt = (now - lastSubmittedAt) / 1000;
          rate = rate * 0.75 + (dSub / sdt) * 0.25;
        } else {
          rate = rate * 0.75 + (dBlocks * (txsPerBlock || txc) / dt) * 0.25;
        }
        gasRate = bps * gasPerBlock;

        if (state === "live") {
          cumTxs = stats && typeof stats.submitted === "number"
            ? stats.submitted
            : cumTxs + dBlocks * (txsPerBlock || txc);
          if (rate > peakTps) peakTps = rate;
          sparkData.push([now, rate]);
          while (sparkData.length && now - sparkData[0][0] > 60000) sparkData.shift();

          if (bps < LIVE_EXIT_BPS && now - liveStartAt > MIN_LIVE_MS) {
            if (lowSince === null) lowSince = now;
            if (now - lowSince > EXIT_GRACE_MS) finish(now);
          } else {
            lowSince = null;
          }
        } else if (state === "waiting") {
          var submittedLive = stats && typeof stats.submitted === "number" && stats.submitted > 1000;
          if (submittedLive || dBlocks / dt > LIVE_ENTER_BPS) goLive(now);
        }
      }
      if (stats && typeof stats.submitted === "number") {
        lastSubmitted = stats.submitted;
        lastSubmittedAt = now;
      }
      lastBlock = bn;
      lastPollAt = now;
      document.getElementById("height").textContent = fmt(bn);
      if (state !== "done") setTimeout(poll, POLL_MS);
    });
  }

  function finish(now) {
    if (state === "done") return;
    state = "done";
    document.body.classList.remove("live");
    var secs = Math.min((now - liveStartAt) / 1000, DURATION_S);
    var total = lastStats && lastStats.submitted ? lastStats.submitted : cumTxs;
    var avg = total / secs;
    setPhase("done", "run complete");
    document.getElementById("f-num").textContent = fmt(total);
    var receiptLine = lastStats && lastStats.receipts > 0
      ? "<br><b>" + fmt(lastStats.receipts) + "</b> account chains receipt-verified."
      : "";
    document.getElementById("f-sub").innerHTML =
      "transactions in <b>" + secs.toFixed(0) + " seconds</b> — average <b>" + fmt(avg) +
      "</b> tx/s, peak <b>" + fmt(peakTps) + "</b> tx/s.<br>&asymp; <b>" +
      (total / ETH_TXS_PER_DAY).toFixed(1) + " days</b> of Ethereum mainnet traffic, on one machine." +
      receiptLine;
    document.getElementById("final-overlay").classList.remove("hidden");
  }

  // ---- animation loop: roll the odometer smoothly between polls ----
  var lastFrame = performance.now();
  function frame(now) {
    var dt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (state === "live") {
      dispTxs += rate * dt;
      // gentle correction toward the exact count
      dispTxs += (cumTxs - dispTxs) * Math.min(1, dt * 2);
      var left = Math.max(0, DURATION_S - (now - liveStartAt) / 1000);
      document.getElementById("countdown").textContent = "T−" + Math.ceil(left) + "s";
    } else if (state === "done") {
      dispTxs = lastStats && lastStats.submitted ? lastStats.submitted : cumTxs;
    }
    document.getElementById("odo").textContent = fmt(dispTxs);
    document.getElementById("tps").textContent = fmt(state === "live" ? rate : 0);
    document.getElementById("bps").textContent = state === "live" ? fmt(bps) : "0";
    document.getElementById("ggas").textContent =
      state === "live" ? (gasRate / 1e9).toFixed(1) : "0";
    var days = dispTxs / ETH_TXS_PER_DAY;
    document.getElementById("eth-line").innerHTML = days > 0.05
      ? "&asymp; <b>" + days.toFixed(1) + " days</b> of Ethereum mainnet traffic"
      : "&nbsp;";
    drawSpark();
    requestAnimationFrame(frame);
  }

  var canvas = document.getElementById("spark");
  var ctx = canvas.getContext("2d");
  function drawSpark() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== w * devicePixelRatio) {
      canvas.width = w * devicePixelRatio;
      canvas.height = h * devicePixelRatio;
    }
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (sparkData.length < 2) return;
    var now = performance.now();
    var max = 1;
    for (var i = 0; i < sparkData.length; i++) max = Math.max(max, sparkData[i][1]);
    max *= 1.15;
    // 1M reference line, when in range
    if (max > 1000000 * 0.6) {
      var refY = h - (1000000 / max) * h;
      ctx.strokeStyle = "rgba(159,176,191,0.35)";
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(0, refY); ctx.lineTo(w, refY); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.beginPath();
    for (var j = 0; j < sparkData.length; j++) {
      var x = w - ((now - sparkData[j][0]) / 60000) * w;
      var y = h - (sparkData[j][1] / max) * h;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "#3f8fe8";
    ctx.lineWidth = 2.5;
    ctx.lineJoin = "round";
    ctx.stroke();
    ctx.lineTo(w, h);
    ctx.lineTo(w - (now - sparkData[0][0]) / 60000 * w, h);
    ctx.closePath();
    ctx.fillStyle = "rgba(63,143,232,0.12)";
    ctx.fill();
  }

  setPhase("waiting", "waiting for node");
  poll();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
