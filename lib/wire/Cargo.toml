[package]
name = "zksync_os_wire"
description = "The node's durable wire formats: versioned replay-record encodings shared by external-node sync and consensus, the consensus block envelope, and the golden corpus pinning every released encoding"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# The consensus-side formats (block envelope) carry commonware trait impls; the
# default includes them so the whole corpus is tested by a plain workspace run.
# Consumers that only need the record formats (the networking stack) opt out.
default = ["consensus"]
consensus = [
    "dep:bytes",
    "dep:commonware-codec",
    "dep:commonware-consensus",
    "dep:commonware-cryptography",
]

[dependencies]
zksync_os_metadata.workspace = true
zksync_os_storage_api.workspace = true
zksync_os_types.workspace = true

alloy = { workspace = true, features = ["consensus", "rlp", "std", "kzg"] }
alloy-rlp.workspace = true
semver.workspace = true

bytes = { workspace = true, optional = true }
commonware-codec = { workspace = true, optional = true }
commonware-consensus = { workspace = true, optional = true }
commonware-cryptography = { workspace = true, optional = true }

[dev-dependencies]
alloy = { workspace = true, features = ["consensus", "signer-local", "k256", "rlp", "std", "kzg"] }
semver.workspace = true
