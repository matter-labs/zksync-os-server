[package]
name = "interop-load"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "interop-load"
path = "src/main.rs"

[[bin]]
name = "interop-load-setup"
path = "src/setup_main.rs"

[dependencies]
alloy = { workspace = true, features = ["contract", "provider-http", "reqwest-rustls-tls", "rpc-types", "signer-local", "sol-types", "json"] }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
humantime.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "fs"] }
uuid = { workspace = true, features = ["v4", "serde"] }
zeroize.workspace = true
zksync_os_contract_interface.workspace = true
zksync_os_types = { workspace = true, features = ["reth"] }
