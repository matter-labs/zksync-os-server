name: ZiSK two-lane e2e

# Runbook steps 11 + 15: run the real two-lane GPU tests with the ZiSK lane
# ARMED — section-7 env, ZISK_GPU_TESTS_REQUIRED=1 (a skip or a disarmed VK
# tripwire is a failure), and the nextest gpu profile whose budgets a healthy
# run actually fits. Mirrors ci.yml's build-prover-tests/prover-tests pair;
# once green, this setup folds into that job and this file retires.
#
# TESTING TRIGGER: path-filtered pull_request, so it runs only when this file
# changes — the fixture-session workflow owns the every-push slot on this
# branch. Restore the parked workflows before merging.
on:
  pull_request:
    paths:
      - .github/workflows/zisk-two-lane-e2e.yaml

concurrency:
  group: zisk-two-lane-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PROVER_GPU_TESTS: 'zisk-two-lane-e2e-tests'
  CUDAARCHS: '80;89;90'
  ZISK_VERSION: "0.18.0"
  # The iteration knob: which prover tests this push runs. The ladder is
  # climbed one rung per edit — each rung is the cheapest test that can
  # falsify the next assumption, so a failure costs minutes, not hours:
  #   rung 1: test(zisk_lane_on_sealed_batches)  — armed lane, real proofs,
  #           commitment + VK binding (first live check of the three-word
  #           public input), ~20 min, no Airbender, no L1
  #   rung 2: test(two_lane_per_batch_e2e)       — the first real settle
  #   rung 3: test(two_lane_multibatch_e2e)      — the 4-batch range
  #   final:  binary(prover)                     — the full ci.yml shape
  E2E_TEST_FILTER: "test(two_lane_per_batch_e2e)"

jobs:
  build:
    name: build the test archive and the ZiSK artifacts (no GPU)
    runs-on: matterlabs-ci-runner-ultra-performance
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Resolve the pinned guest rev
        id: guest
        run: |
          rev="$(grep -m1 'zksync-os-zisk-lib' Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/\1/')"
          echo "resolved guest rev: ${rev}"
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"

      - name: Checkout the guest repo at the pinned rev
        uses: actions/checkout@v4
        with:
          repository: matter-labs/zksync-os-zisk
          ref: ${{ steps.guest.outputs.rev }}
          path: zisk-guest

      - name: Build both guest ELFs (pinned container, recorded-hash verified)
        working-directory: zisk-guest
        run: |
          ./build-guest.sh
          ./build-aggregator.sh

      - name: Build the ZiSK prover service
        working-directory: zisk-guest/prover
        run: |
          # Unbind the nested crate from the server workspace (see the
          # fixture-session workflow for why).
          grep -q '^\[workspace\]' Cargo.toml || printf '\n[workspace]\n' >> Cargo.toml
          cargo build --release --bin zksync-os-zisk-prover-service

      - name: Assemble the ZiSK artifact bundle
        run: |
          mkdir -p zisk-artifacts
          cp zisk-guest/out/zksync-os-zisk-guest zisk-artifacts/
          cp zisk-guest/out/zksync-os-zisk-guest-aggregator zisk-artifacts/
          cp zisk-guest/prover/target/release/zksync-os-zisk-prover-service zisk-artifacts/
          ls -la zisk-artifacts

      - name: Upload the ZiSK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zisk-e2e-artifacts
          path: zisk-artifacts
          if-no-files-found: error
          retention-days: 3

      # Same shape (and the same WORKSPACE_DIR hack) as ci.yml's
      # build-prover-tests job, which runs on this runner family today.
      - name: Build and archive the prover tests
        env:
          WORKSPACE_DIR: "/opt/./actions-runner/_work/zksync-os-server/zksync-os-server"
        run: |
          cargo nextest archive --release -p zksync_os_integration_tests \
            --features gpu-prover-tests --test prover --archive-file ${PROVER_GPU_TESTS}.tar.zst

      - name: Upload the test archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROVER_GPU_TESTS }}
          path: ${{ env.PROVER_GPU_TESTS }}.tar.zst
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: two-lane e2e on the GPU runner
    runs-on: [matterlabs-ci-hetzner-rtx6000-gpu]
    needs: build
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Check Nvidia driver version
        run: nvidia-smi

      - name: Download the test archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROVER_GPU_TESTS }}

      - name: Download the ZiSK artifacts
        uses: actions/download-artifact@v4
        with:
          name: zisk-e2e-artifacts
          path: zisk-artifacts

      - name: Install ZiSK system dependencies
        run: |
          SUDO=""
          [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xz-utils jq curl build-essential qemu-system libomp-dev libgmp-dev \
            nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev \
            libsecp256k1-dev libsodium-dev libpqxx-dev nasm libopenmpi-dev \
            openmpi-bin openmpi-common libclang-dev clang gcc-riscv64-unknown-elf \
            python3

      - name: Install rustup (cargo-zisk toolchain install links into it)
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install ZiSK toolchain and both proving keys
        run: |
          curl -sSfL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/v${ZISK_VERSION}/ziskup/install.sh" -o /tmp/ziskup-install.sh
          bash /tmp/ziskup-install.sh -v "${ZISK_VERSION}" --provingkey --gpu -y
          echo "$HOME/.zisk/bin" >> "$GITHUB_PATH"
          "$HOME/.zisk/bin/ziskup" setup_snark

      - name: Download CRS setup file
        env:
          CRS_FILE_URL: https://storage.googleapis.com/matterlabs-setup-keys-europe/setup-keys/setup_compact.key
        run: wget -q "${CRS_FILE_URL}"

      - name: Decompress L1 state fixtures
        run: |
          for gz_file in local-chains/*/l1-state.json.gz; do
            json="${gz_file%.gz}"
            if [ ! -f "$json" ]; then
              gunzip -k "$gz_file"
            fi
          done

      # --workspace-remap is mandatory (see ci.yml's prover-tests job).
      # The ZiSK lane is ARMED: a silent skip or a disarmed VK tripwire fails.
      - name: Run the two-lane e2e tests on GPU
        env:
          COMPACT_CRS_FILE: ${{ github.workspace }}/setup_compact.key
          ZISK_GPU_TESTS_REQUIRED: "1"
          ZISK_ELF: ${{ github.workspace }}/zisk-artifacts/zksync-os-zisk-guest
          ZISK_AGG_ELF: ${{ github.workspace }}/zisk-artifacts/zksync-os-zisk-guest-aggregator
          ZISK_PROVER_BIN: ${{ github.workspace }}/zisk-artifacts/zksync-os-zisk-prover-service
          # Runbook section 4: the v31 pin set.
          ZISK_PROGRAM_VK: "0x44e3d132399c8f3a03ce9672ba0ca00c6503db918731c7ab46d6faea445236ec"
          ZISK_VADCOP_VK: "0xcf2a309856f107b143836ada112806da71ae11567fa3f2d2050baba5381c7b7d"
          ZISK_AGG_PROGRAM_VK: "0x4c3d7317a62f651d813ba6afbbce59e45eaa7c009ab2a9b51d2f0fb3e7987254"
        run: |
          export ZISK_PK="$HOME/.zisk/provingKey"
          export ZISK_SK="$HOME/.zisk/provingKeySnark"
          # The daemon validates --zisk-binary as a filesystem path, not a
          # PATH-resolvable name.
          export ZISK_BINARY="$HOME/.zisk/bin/cargo-zisk"
          chmod +x zisk-artifacts/*
          ulimit -s 300000
          echo "running: ${E2E_TEST_FILTER}"
          cargo nextest run -E "${E2E_TEST_FILTER}" --no-capture --profile gpu \
            --archive-file "${PROVER_GPU_TESTS}.tar.zst" \
            --workspace-remap ${GITHUB_WORKSPACE}
