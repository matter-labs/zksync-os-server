name: CI

on:
  push:
    branches:
     - main
  pull_request:

# Cancel new runs for PRs only
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default environment variables
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TEST_RESULTS_XML: 'test-results.xml'
  PROVER_GPU_TESTS: 'prover-gpu-tests'
  ZISK_VERSION: '0.18.0'
  CUDAARCHS: '80;89;90'
  # Run tests 10 times in case of push to main branch to catch possible flakiness
  NEXTEST_ITERATIONS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--stress-count 10' || '' }}

# Add default permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:

  ############################
  #       Build server       #
  ############################
  build:
    runs-on: matterlabs-ci-runner-high-performance
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Build server
        run: cargo build --release --bin zksync-os-server --features gcp

      - name: Upload server binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zksync-os-server-${{ github.sha }}
          path: target/release/zksync-os-server
          if-no-files-found: error
          retention-days: 1


  ############################
  #     Format and lint      #
  ############################
  format-and-lint:
    runs-on: matterlabs-ci-runner-high-performance
    env:
      ZKSYNC_USE_CUDA_STUBS: true
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings


  #################################################
  #      Run unit and core integration tests      #
  #################################################
  test:
    runs-on: matterlabs-ci-runner-high-performance
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Run tests
        run: cargo nextest run --release --workspace ${NEXTEST_ITERATIONS}

      - name: Upload test results
        if: always() && !cancelled()
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: 'Test results'
          files: target/nextest/default/${{ env.TEST_RESULTS_XML }}
          action_fail_on_inconclusive: true
          compare_to_earlier_commit: false # Do not compare with `main` due to different number of iterations


  ######################################
  # Measure code coverage on main push #
  ######################################
  code-coverage:
    # Code coverage is measured only on push to main branch
    # as it slows down PR testing significantly (2m -> 15m for tests execution)
    # due to overhead with LLVM instrumentation.
    # So, we keep the main numbers, but not force every PR to wait for it.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: matterlabs-ci-runner-high-performance
    env:
      RUSTC_BOOTSTRAP: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Measure coverage
        env:
          # cargo-llvm-cov overrides the config.toml rustflags; keep `tokio_unstable` on since
          # the runtime metrics require it unconditionally.
          RUSTFLAGS: '--cfg tokio_unstable'
        run: cargo llvm-cov --lcov --output-path lcov.info nextest --workspace --release --profile coverage

      - name: Generate codecov report
        uses: codecov/codecov-action@fdcc8476540edceab3de004e990f80d881c6cc00 # v5.5.0
        if: always() && !cancelled()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          slug: ${{ github.repository }}


  ############################################
  #   Enforce wire format file immutability  #
  ############################################
  check-wire-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # fetch tags

      - name: Check that replay wire format version is set correctly
        shell: bash
        run: |
          # get latest tag (latest release)
          TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)

          # check that released wire format files that still exist are unchanged
          DIR=lib/network/src/wire/replays
          git fetch --depth=1 origin tag "$TAG"
          for FILE in "$DIR"/v*.rs; do
            if git show "$TAG:$FILE" > /tmp/old_wire_format.rs 2>/dev/null; then
              if ! diff -q /tmp/old_wire_format.rs "$FILE"; then
                echo "Change detected in already released wire format: $FILE"
                exit 1
              fi
            else
              echo "New wire format created in this change: $FILE"
            fi
          done


  ####################################
  #  Build prover integration tests  #
  ####################################
  build-prover-tests:
    runs-on: matterlabs-ci-runner-ultra-performance
    steps:

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      # The ZiSK artifacts follow the server's own guest pin, so they can never drift from it.
      - name: Resolve the pinned guest rev
        id: guest
        run: |
          rev="$(grep -m1 'zksync-os-zisk-lib' Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/\1/')"
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"

      - name: Checkout the guest repo at the pinned rev
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: matter-labs/zksync-os-zisk
          ref: ${{ steps.guest.outputs.rev }}
          path: zisk-guest

      - name: Build both guest ELFs (pinned container, recorded-hash verified)
        working-directory: zisk-guest
        run: |
          ./build-guest.sh
          ./build-aggregator.sh

      - name: Build the ZiSK prover service
        working-directory: zisk-guest/prover
        run: |
          # Unbind the nested crate from the server workspace cargo would otherwise resolve it against.
          grep -q '^\[workspace\]' Cargo.toml || printf '\n[workspace]\n' >> Cargo.toml
          cargo build --release --bin zksync-os-zisk-prover-service

      - name: Upload the ZiSK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zisk-e2e-artifacts
          path: |
            zisk-guest/out/zksync-os-zisk-guest
            zisk-guest/out/zksync-os-zisk-guest-aggregator
            zisk-guest/prover/target/release/zksync-os-zisk-prover-service
          if-no-files-found: error
          retention-days: 1

      # Build and archive tests to execute on another machine.
      # Use `cargo nextest archive` to make sure that all dependencies are included properly.
      - name: Build and archive test
        env:
          # This is a special mandatory hack to transfer test binary from one machine to another.
          # We must use a dummy `./` path addition in the workspace path /home/runner/_work
          # to prevent GitHub Actions to replace it to the mapped `/__w` folder in the docker container.
          # This is required to make sure that the paths to workspace artifacts like l1-state.json.gz
          # are correct inside prebuilt binary.
          # This variable overwrites the default relative `./` in the .cargo/config.toml.
          WORKSPACE_DIR: "/opt/./actions-runner/_work/zksync-os-server/zksync-os-server"
        run: |
          cargo nextest archive --release -p zksync_os_integration_tests \
            --features gpu-prover-tests --test prover --archive-file ${PROVER_GPU_TESTS}.tar.zst

      - name: Upload tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PROVER_GPU_TESTS }}
          path: ${{ env.PROVER_GPU_TESTS }}.tar.zst
          if-no-files-found: error
          retention-days: 1 # delete sooner to not waste storage

  #################################################
  #  Run prover integration tests on GPU machine  #
  #################################################
  prover-tests:
    runs-on: [matterlabs-ci-hetzner-rtx6000-gpu]
    needs: build-prover-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Check Nvidia driver version
        run: |
          echo $WORKSPACE
          pwd
          nvidia-smi

      - name: Download prebuilt tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PROVER_GPU_TESTS }}

      - name: Download the ZiSK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zisk-e2e-artifacts
          path: zisk-artifacts

      - name: Install ZiSK system dependencies
        run: |
          SUDO=""
          [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xz-utils jq curl build-essential qemu-system libomp-dev libgmp-dev \
            nlohmann-json3-dev protobuf-compiler uuid-dev libgrpc++-dev \
            libsecp256k1-dev libsodium-dev libpqxx-dev nasm libopenmpi-dev \
            openmpi-bin openmpi-common libclang-dev clang gcc-riscv64-unknown-elf \
            python3

      # cargo-zisk's toolchain install links into rustup and errors if the binary is absent.
      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ziskup skips already-installed pieces, so the persistent runner pays the key downloads once.
      - name: Install ZiSK toolchain and both proving keys
        run: |
          curl -sSfL "https://raw.githubusercontent.com/0xPolygonHermez/zisk/v${ZISK_VERSION}/ziskup/install.sh" -o /tmp/ziskup-install.sh
          bash /tmp/ziskup-install.sh -v "${ZISK_VERSION}" --provingkey --gpu -y
          echo "$HOME/.zisk/bin" >> "$GITHUB_PATH"
          "$HOME/.zisk/bin/ziskup" setup_snark

      - name: Download CRS setup file
        if: steps.cache-crs.outputs.cache-hit != 'true'
        env:
          # Download CRS file from EU storage for GPU runner
          CRS_FILE_URL: https://storage.googleapis.com/matterlabs-setup-keys-europe/setup-keys/setup_compact.key
        run: wget -q --show-progress "${CRS_FILE_URL}"

      - name: Decompress L1 state fixtures
        run: |
          for gz_file in local-chains/*/l1-state.json.gz; do
            json="${gz_file%.gz}"
            if [ ! -f "$json" ]; then
              gunzip -k "$gz_file"
            fi
          done

      # --workspace-remap is mandatory (!)
      # Otherwise, the prebuilt binary will not be able to find its dependencies and fails to execute
      # The ZiSK lane is ARMED: a silent artifact skip or a disarmed VK tripwire is a failure.
      # The gpu nextest profile carries budgets a healthy two-lane run actually fits.
      - name: Run prover tests on GPU
        env:
          COMPACT_CRS_FILE: ${{ github.workspace }}/setup_compact.key
          ZISK_GPU_TESTS_REQUIRED: "1"
          ZISK_ELF: ${{ github.workspace }}/zisk-artifacts/out/zksync-os-zisk-guest
          ZISK_AGG_ELF: ${{ github.workspace }}/zisk-artifacts/out/zksync-os-zisk-guest-aggregator
          ZISK_PROVER_BIN: ${{ github.workspace }}/zisk-artifacts/prover/target/release/zksync-os-zisk-prover-service
          # Runbook section 4: the v31 pin set.
          ZISK_PROGRAM_VK: "0x44e3d132399c8f3a03ce9672ba0ca00c6503db918731c7ab46d6faea445236ec"
          ZISK_VADCOP_VK: "0xcf2a309856f107b143836ada112806da71ae11567fa3f2d2050baba5381c7b7d"
          ZISK_AGG_PROGRAM_VK: "0x4c3d7317a62f651d813ba6afbbce59e45eaa7c009ab2a9b51d2f0fb3e7987254"
        run: |
          export ZISK_PK="$HOME/.zisk/provingKey"
          export ZISK_SK="$HOME/.zisk/provingKeySnark"
          export ZISK_BINARY="$HOME/.zisk/bin/cargo-zisk"
          chmod +x "${ZISK_PROVER_BIN}"
          ulimit -s 300000
          cargo nextest run -E 'binary(prover)' --no-capture --profile gpu \
            --archive-file "${PROVER_GPU_TESTS}.tar.zst" \
            --workspace-remap ${GITHUB_WORKSPACE}

  ###############################
  #     Configs smoke test      #
  ###############################
  config-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zksync-os-server-${{ github.sha }}
          path: .

      - name: Run config smoke test
        env:
          LOG_USE_COLOR: false
          SERVER_LOGFILE: server.log
        run: ./.github/scripts/test-configs.sh


  ###############################
  #  Mandatory CI status check  #
  ###############################
  ci-success:
    name: Github Status Check
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    needs:
      [
        build,
        test,
        format-and-lint,
        build-prover-tests,
        prover-tests,
        check-wire-version,
        config-tests,
      ]
    steps:
      - name: Status
        run: |
          # This will check all jobs status in the `needs` list, and fail job if one is failed.
          # Since we split prover and core to different flows, this job will be only as Required Status Check in the Pull Request.
          if [[ ${{ contains(join(needs.*.result, ','), 'failure') }} == "true" ]]; then
            echo "Intentionally failing to block PR from merging"
            exit 1
          fi
