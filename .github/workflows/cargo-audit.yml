name: Security audit

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    # Run every Monday-Friday at 8:30 AM UTC.
    - cron: "30 8 * * 1-5"

# Prevent multiple runs for the same pull request or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Set permissions
permissions:
  contents: read
  issues: write # required for cargo-audit
  checks: write # required for cargo-audit

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      # Pre-install cargo-audit to avoid using nightly toolchain after checking out code
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit@0.22.0
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run cargo audit
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 'RUSTSEC-2025-0055' todo: waiting for ark-relations to release a patch https://github.com/arkworks-rs/snark/issues/413
          # 'RUSTSEC-2026-0194', 'RUSTSEC-2026-0195': quick-xml < 0.41 DoS advisories, pulled in transitively via
          # `inferno` (flamegraph generation) and `plist` -> `os_info` -> `sentry-contexts` (local OS metadata for
          # Sentry). Neither path parses untrusted/remote XML. No released version of `inferno` or `plist` depends
          # on quick-xml >=0.41 yet, so this cannot be resolved by updating. Revisit once upstream bumps land.
          # 'RUSTSEC-2023-0071': Marvin timing sidechannel in `rsa` private-key operations. Production code only
          # performs public-key RSA-OAEP encryption (wrapping the age file key to the GCP KMS public key);
          # private-key decryption happens inside GCP KMS, never locally. No patched version exists yet.
          ignore: 'RUSTSEC-2025-0055,RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2023-0071'
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@76cd80eb775d7bbbd2d80292136d74d39e1b4918 # v2.0.14
        with:
          manifest-path: "./Cargo.toml"
          command: check
          command-arguments: "--allow unmaintained --hide-inclusion-graph"
