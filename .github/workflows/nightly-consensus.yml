name: Nightly consensus sweep

# The consensus simulation corpus runs on every PR with each scenario's own small
# seed set. This lane reruns the identical scenarios over a much wider sweep: every
# seed is a genuinely different scheduling/network interleaving, and every seed runs
# twice with bit-exact reproduction asserted (the determinism gate). A red run here
# is a real bug with a one-command deterministic reproducer — the failing scenario
# prints its name and seed.

on:
  schedule:
    # Daily, off the top-of-the-hour rush on shared runners.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seed-sweep size: every scenario runs seeds 0..N, each twice"
        default: "128"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sim-seed-sweep:
    runs-on: matterlabs-ci-runner-high-performance
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup runner
        uses: ./.github/actions/runner-setup

      - name: Run the simulation corpus over a wide seed sweep
        env:
          CONSENSUS_SIM_SEEDS: ${{ github.event.inputs.seeds || '128' }}
        run: >
          cargo nextest run --release --profile consensus-nightly
          -p zksync_os_consensus_sim
          -p zksync_os_consensus_core
          -p zksync_os_consensus_execution
