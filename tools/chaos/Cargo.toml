[package]
name = "zksync_os_chaos"
description = "Chaos rig for BFT consensus: generates containerized validator clusters and drives seeded fault schedules against them"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "chaos"
path = "src/main.rs"

[dependencies]
alloy = { workspace = true, features = [
    "network",
    "providers",
    "reqwest",
    "signer-local",
    "rpc-types",
    "sol-types",
    "contract",
] }
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
commonware-codec.workspace = true
commonware-cryptography.workspace = true
futures.workspace = true
humantime = "2.2.0"
rand08.workspace = true
reqwest = { workspace = true, features = ["json"] }
zksync_os_status_server.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["full"] }
zksync_os_contract_interface.workspace = true
zksync_os_types.workspace = true
