[graph]
targets = []
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # quick-xml < 0.41 DoS advisories. Pulled in transitively via `inferno`
    # (flamegraph generation, from the zksync-airbender git dependency) and
    # `plist` -> `os_info` -> `sentry-contexts` (local OS metadata for Sentry
    # error context). Neither path parses untrusted/remote XML. No released
    # version of `inferno` or `plist` depends on quick-xml >=0.41 yet (latest
    # `inferno` 0.12.6 and `plist` 1.9.0 both still require `^0.39`), so a
    # `cargo update` cannot resolve this. Revisit once upstream bumps land.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # Marvin timing sidechannel in `rsa` private-key operations. We use `rsa`
    # directly in `replay_archive` for KMS envelope encryption, but production
    # code only performs public-key RSA-OAEP encryption (wrapping the age file
    # key to the KMS public key); private-key decryption happens inside GCP KMS,
    # never locally. Local `RsaPrivateKey` usage is test-only. No patched
    # version exists yet (tracked in RustCrypto/RSA#19).
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "allow"
deny = []
skip = []
skip-tree = []

workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "CDDL-1.0",
    "CC0-1.0",
]
