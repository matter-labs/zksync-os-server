[graph]
targets = []
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Yanked transitives (spin 0.10.0, core2 — no unyanked version exists) are tolerated via the
# workflow's `--allow yanked`; the config key for this varies across cargo-deny versions.
ignore = [
    # Marvin timing sidechannel in `rsa` private-key operations. We use `rsa`
    # directly in `replay_archive` for KMS envelope encryption, but production
    # code only performs public-key RSA-OAEP encryption (wrapping the age file
    # key to the KMS public key); private-key decryption happens inside GCP KMS,
    # never locally. Local `RsaPrivateKey` usage is test-only. No patched
    # version exists yet (tracked in RustCrypto/RSA#19).
    "RUSTSEC-2023-0071",
    # Unmaintained notices on frozen transitive deps, none reachable to fix here.
    "RUSTSEC-2025-0141", # bincode 1.x unmaintained
    "RUSTSEC-2026-0247", # bitmaps unmaintained
    "RUSTSEC-2026-0105", # core2 unmaintained, versions yanked
    # bitmaps (via imbl <- reth-transaction-pool): no fixed release; the unsound
    # TryFrom<&[u8]> constructor is unused on this dependency path.
    "RUSTSEC-2025-0167",
    # lru (via alloy-provider, pins ^0.16; fixed only in a breaking release): needs a key
    # whose Drop panics during pop() — keys on this path have trivial Drop.
    "RUSTSEC-2026-0253",
]

[bans]
multiple-versions = "allow"
deny = []
skip = []
skip-tree = []

workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "CDDL-1.0",
    "CC0-1.0",
]
