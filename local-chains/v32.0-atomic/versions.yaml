general:
  protocol_version: "v32.0"
  variant: "atomic-interop (IMT bundle model)"
  genesis_root: "0xa8de0b9132e9db7fb8245f5bc02a5b8d4c919a6d64bb847e9ae12ae388e16a30"

# This preset's genesis.json + l1-state.json.gz + per-chain configs all come from ONE
# consistent atomic deploy of two L1-settling chains (6565, 6566). Regenerate them
# together via generate-atomic-multichain.sh — never swap genesis without the matching L1 state.

era-contracts:
  # The atomic-interop DA contracts with the genesis protocol version bumped to 0.32.0, so
  # chains deployed from them report v32 and activate the server's atomic (v32) code paths.
  # Rotate to the branch that lands atomic as the real v32 (`atomic-imt-reduced` line) once
  # the stack adapts to it.
  branch: "ad-atomic-interop-da-v32-genesis"
  sha: "0e64eab27ee4301c65a84b82a60faded120676fb"

zksync-os-integration-tests:
  # Provides the zk-deployer CLI (bootstrap + apply + server-config) used to generate the artifacts.
  branch: "atomic-interop-work"
  sha: "bcca5cd"

zksync-os-server:
  # The atomic server (this repo): the v32-gated atomic-interop stack — 8-leaf chain batch
  # root, IMT proof RPCs (zks_getImtInclusionProof / zks_getImtNonInclusionProof /
  # zks_getImtLowNullifierIndex), timestamped interop-root import and the encoding-v2
  # execute wire.
  branch: "ad-atomic-interop"
