# Protocol version artifact registry.
#
# This file is the single source of truth for which exact artifacts
# correspond to each protocol version.  It is read at build time by
# lib/types/build.rs (to generate protocol config code) and by
# lib/multivm/build.rs (to download app.bin artifacts).
#
# ── Execution versions ──
# Each [execution_version."Vn"] section defines the forward_system crate
# that implements a given execution version, and optionally a separate
# simulation crate for tx simulation (e.g. eth_estimateGas).
#
# ── Proving versions ──
# Each [proving_version."Vn"] section defines the numeric ID used in the
# proof wire format and the verification key hash for L1 proof verification.
#
# ── Protocol versions ──
# Each [protocol."M.m.p"] references an execution_version and a
# proving_version by name, and optionally specifies an app_bin_tag for
# downloading app.bin proving artifacts.
#
# The [historical_vk_hashes] section lists VK hashes from older protocol
# versions (execution versions 1-3) that are no longer in the registry but
# are still accepted by validate_vk_hash for backward compatibility.
#
# Rules:
# 1. Every protocol version the server can execute MUST have an entry here.
# 2. The forward_system_crate values MUST match dependencies in Cargo.toml.
# 3. The forward_system_tag values MUST match the git tags in Cargo.toml.
# 4. Historical entries MUST NOT be modified once proven on L1.
#
# When adding a new protocol version:
# 1. Add execution_version / proving_version sections if needed.
# 2. Add a new [protocol."M.m.p"] section referencing them.
# 3. Make sure the forward_system dependency exists in Cargo.toml.
# 4. Run `./tools/check-versions-toml.sh` to verify consistency.

# ---- Execution versions ----

