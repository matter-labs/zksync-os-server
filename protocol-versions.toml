# Protocol version artifact registry.
#
# This file is the single source of truth for which exact artifacts
# correspond to each protocol version.  It is read by the multivm build
# script and validated in CI against Cargo.toml to ensure consistency.
#
# Each [protocol."M.m.p"] section contains:
#   execution_version  – u32 stored in BlockContext, used by multivm to dispatch
#   vk_hash            – verification key hash for L1 proof verification
#   forward_system_crate / forward_system_tag – crate used for block execution
#   simulation_crate / simulation_tag         – (optional) separate crate for tx simulation
#   app_bin_tag        – (optional) tag for downloading app.bin proving artifacts;
#                        if absent, no app.bin is needed for this protocol version
#
# Rules:
# 1. Every protocol version the server can execute MUST have an entry here.
# 2. The forward_system_crate values MUST match dependencies in Cargo.toml.
# 3. The forward_system_tag values MUST match the git tags in Cargo.toml.
# 4. Historical entries MUST NOT be modified once proven on L1.
#
# When adding a new protocol version:
# 1. Add a new [protocol."M.m.p"] section below.
# 2. Make sure the forward_system dependency exists in Cargo.toml.
# 3. Run `./tools/check-versions-toml.sh` to verify consistency.

# ---- Protocol version 0.29.x ----
