# Protocol version artifact registry.
#
# This file is the single source of truth for which exact artifacts
# correspond to each protocol version.  It is read at build time by
# lib/types/build.rs (to generate protocol config code) and by
# lib/multivm/build.rs (to download app.bin artifacts).
#
# ── Execution versions ──
# Each [execution_version."vN"] section defines the forward_system crate
# release for execution version N — the core engine that handles both
# block execution and proof input generation. N matches the value
# stored in BlockContext.execution_version at runtime.
#
# ── Protocol versions ──
# Each [protocol."M.m.p"] references an execution version and carries
# per-protocol metadata: vk_hash (for L1 verification) and
# verifier_version_deprecated (legacy, to be removed in V32).
#
# The [historical_vk_hashes] section lists VK hashes from older protocol
# versions (execution versions 1-3) that are no longer in the registry but
# are still accepted by validate_vk_hash for backward compatibility.
#
# Rules:
# 1. Every protocol version the server can execute MUST have an entry here.
# 2. The execution_version crate values MUST match dependencies in Cargo.toml.
# 3. The execution_version tag values MUST match the git tags in Cargo.toml.
# 4. Historical entries MUST NOT be modified once proven on L1.
#
# When adding a new protocol version:
# 1. Add an [execution_version."vN"] section if this is a new crate release.
# 2. Add a new [protocol."M.m.p"] section referencing it.
# 3. Make sure the forward_system dependency exists in Cargo.toml.
# 4. Run `./tools/check-versions-toml.sh` to verify consistency.

# ---- Execution versions ----

[execution_version."v4"]
crate = "zk_os_forward_system_0_0_28"
tag = "v0.0.28-interface-v0.0.14"

[execution_version."v5"]
crate = "zk_os_forward_system"
tag = "v0.2.8-interface-v0.0.14"
# app.bin was built from a different tag due to a toolchain-induced binary change.
app_bin_tag = "v0.2.5"
# Module name for zksync_os_multivm::apps::vN (historical, matches old proving version).
app_module = 6
# Simulation uses a separate crate to support eth_estimateGas with 0-balance accounts.
simulation_crate = "zk_os_forward_system_0_2_8"
simulation_tag = "v0.2.8-simulation-only-interface-v0.0.14"

[execution_version."v6"]
crate = "zk_os_forward_system_dev"
tag = "dev-20260311"
app_bin_tag = "dev-20260311"
# Module name for zksync_os_multivm::apps::vN (historical, matches old proving version).
app_module = 7

