execution_version = 4
vk_hash = "0xa385a997a63cc78e724451dca8b044b5ef29fcdc9d8b6ced33d9f58de531faa5"
forward_system_crate = "zk_os_forward_system_0_0_28"
forward_system_tag = "v0.0.28-interface-v0.0.14"

[protocol."0.29.1"]
execution_version = 4
vk_hash = "0xa385a997a63cc78e724451dca8b044b5ef29fcdc9d8b6ced33d9f58de531faa5"
forward_system_crate = "zk_os_forward_system_0_0_28"
forward_system_tag = "v0.0.28-interface-v0.0.14"

